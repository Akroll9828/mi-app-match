<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Match Real</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #fd297b, #ff5864, #ff655b); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #fff; }
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); color: #333; width: 320px; text-align: center; }
        .box input, .box textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-main { background: #ff5864; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .card-container { display: none; position: relative; width: 340px; height: 480px; background: white; border-radius: 20px; overflow: hidden; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .profile-img { width: 100%; height: 70%; object-fit: cover; }
        .profile-info { padding: 15px; height: 30%; background: white; box-sizing: border-box; }
        .profile-name { font-size: 22px; font-weight: bold; margin: 0; }
        .profile-geo { color: #777; font-size: 14px; margin: 4px 0; }
        .profile-bio { font-size: 14px; color: #444; margin: 0; }
        .actions { display: none; gap: 20px; margin-top: 25px; }
        .btn-action { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #f1f2f6; background: white; cursor: pointer; font-size: 22px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .match-screen { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); color:white; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
    </style>
</head>
<body>

    <!-- PANTALLA DE REGISTRO PARA PERSONAS REALES -->
    <div class="box" id="reg-screen">
        <h2>Crea tu Perfil Real</h2>
        <p style="font-size: 13px; color: #666;">Ingresa tus datos reales para que personas de todo el mundo te conozcan gratis.</p>
        <input type="text" id="reg-name" placeholder="Tu Nombre y Edad (ej: Juan, 25)">
        <input type="text" id="reg-country" placeholder="Tu País (ej: Perú)">
        <input type="text" id="reg-photo" placeholder="Link de tu Foto (URL)">
        <textarea id="reg-bio" placeholder="Cuéntale al mundo sobre ti..."></textarea>
        <p style="font-size: 11px; color: #888; margin: 5px 0;">Simulación GPS automática para rango de distancia</p>
        <button class="btn-main" onclick="registerUser()">Ingresar a la App</button>
    </div>

    <!-- CONTENEDOR TIPO TINDER -->
    <div style="text-align: center; display: flex; flex-direction: column; align-items: center;">
        <div id="filter-area" style="display:none; margin-bottom: 15px; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; font-size:14px;">
            Distancia máxima: <input type="number" id="max-idx" value="500" style="width:60px; border:none; text-align:center; font-weight:bold; border-radius:5px;" onchange="getMatches()"> km
        </div>

        <div class="card-container" id="main-card">
            <div class="match-screen" id="match-pop">
                <h1 style="color:#2ecc71; font-size: 30px;">¡ES UN MATCH! 😍</h1>
                <p>¡Se gustaron mutuamente!</p>
                <button onclick="closeMatch()" style="padding: 8px 15px; border-radius: 20px; border:none; background:#ff5864; color:white; cursor:pointer; font-weight:bold;">Continuar</button>
            </div>
            <img src="" id="view-img" class="profile-img">
            <div class="profile-info">
                <p class="profile-name" id="view-name"></p>
                <p class="profile-geo" id="view-geo"></p>
                <p class="profile-bio" id="view-bio"></p>
            </div>
        </div>

        <div class="actions" id="action-area">
            <button class="btn-action" onclick="getMatches()">❌</button>
            <button class="btn-action" style="color: #2ecc71;" onclick="sendLike()">💚</button>
        </div>
    </div>

    <script>
        let myId = null;
        let activeProfile = null;
        // Coordenadas simuladas para el registro inicial
        let myLat = -12.0266; 
        let myLon = -77.0011;

        async function registerUser() {
            const name = document.getElementById('reg-name').value;
            const country = document.getElementById('reg-country').value;
            const photoUrl = document.getElementById('reg-photo').value;
            const bio = document.getElementById('reg-bio').value;

            if(!name || !country || !bio) return alert("Por favor llena tus datos reales.");

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, country, bio, photoUrl, lat: myLat, lon: myLon })
            });
            const data = await res.json();
            if(data.success) {
                myId = data.userId;
                document.getElementById('reg-screen').style.display = 'none';
                document.getElementById('main-card').style.display = 'block';
                document.getElementById('action-area').style.display = 'flex';
                document.getElementById('filter-area').style.display = 'block';
                getMatches();
            }
        }

        async function getMatches() {
            const dist = document.getElementById('max-idx').value;
            const res = await fetch('/api/discover', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: myId, maxDistanceKm: parseInt(dist) })
            });
            const profiles = await res.json();
            if(profiles.length > 0) {
                activeProfile = profiles[0]; // Mostrar el primer usuario real disponible
                document.getElementById('view-name').innerText = activeProfile.name;
                document.getElementById('view-geo').innerText = `${activeProfile.country} • A ${activeProfile.distance} km de ti`;
                document.getElementById('view-bio').innerText = activeProfile.bio;
                document.getElementById('view-img').src = activeProfile.photoUrl;
            } else {
                activeProfile = null;
                document.getElementById('view-name').innerText = "No hay usuarios reales registrados";
                document.getElementById('view-geo').innerText = "Comparte tu enlace";
                document.getElementById('view-bio').innerText = "Cuando otra persona real entre desde tu link y ponga sus datos, aparecerá aquí al instante.";
                document.getElementById('view-img').src = "https://unsplash.com";
            }
        }

        async function sendLike() {
            if(!activeProfile) return;
            const res = await fetch('/api/like', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fromUserId: myId, toUserId: activeProfile._id })
            });
            const data = await res.json();
            if(data.match) {
                document.getElementById('match-pop').style.display = 'flex';
            } else {
                getMatches();
            }
        }

        function closeMatch() {
            document.getElementById('match-pop').style.display = 'none';
            getMatches();
        }
    </script>
</body>
</html>
