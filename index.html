<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Match Evolution</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #fd297b, #ff5864, #ff655b); margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #fff; }
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); color: #333; width: 360px; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
        h2 { margin-top: 0; color: #ff5864; }
        input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .row { display: flex; gap: 10px; }
        .upload-section { background: #f8f9fa; padding: 12px; border-radius: 10px; margin: 10px 0; text-align: left; }
        .upload-section label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
        .interest-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0; }
        .chip { padding: 6px 12px; background: #f1f2f6; border-radius: 15px; font-size: 12px; cursor: pointer; color: #555; }
        .chip.selected { background: #ff5864; color: white; }
        .btn-main { background: #ff5864; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; }
        
        /* Estilos del Feed Tipo Tinder */
        .app-container { display: none; width: 360px; text-align: center; }
        .group-tabs { display: flex; background: rgba(255,255,255,0.2); border-radius: 25px; padding: 4px; margin-bottom: 15px; overflow-x: auto; gap: 5px; }
        .tab { padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .tab.active { background: white; color: #ff5864; font-weight: bold; }
        .card { position: relative; width: 360px; height: 520px; background: white; border-radius: 20px; overflow: hidden; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .profile-img { width: 100%; height: 65%; object-fit: cover; }
        .img-counter { position: absolute; top: 10px; width: 100%; display: flex; justify-content: center; gap: 5px; }
        .indicator { width: 30px; height: 4px; background: rgba(255,255,255,0.5); border-radius: 2px; }
        .indicator.active { background: white; }
        .verified-badge { background: #2ecc71; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 5px; vertical-align: middle; }
        .info-panel { padding: 15px; height: 35%; box-sizing: border-box; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }
        .actions { display: flex; justify-content: center; gap: 25px; margin-top: 20px; }
        .btn-action { width: 60px; height: 60px; border-radius: 50%; border: none; background: white; cursor: pointer; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .match-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); color: white; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <!-- FORMULARIO DE REGISTRO AVANZADO -->
    <div class="box" id="reg-screen">
        <h2>Crear Perfil Premium</h2>
        <input type="text" id="reg-name" placeholder="Tu Nombre">
        <input type="number" id="reg-age" placeholder="Tu Edad (Mínimo 18)">
        
        <div class="row">
            <select id="reg-gender">
                <option value="hombre">Soy Hombre</option>
                <option value="mujer">Soy Mujer</option>
            </select>
            <select id="reg-interest">
                <option value="mujer">Busco Mujeres</option>
                <option value="hombre">Busco Hombres</option>
                <option value="todos">Busco Ambos</option>
            </select>
        </div>

        <div class="row">
            <input type="number" id="reg-min-age" placeholder="Edad Mínima" value="18">
            <input type="number" id="reg-max-age" placeholder="Edad Máxima" value="35">
        </div>
        <input type="number" id="reg-max-dist" placeholder="Distancia Máxima de búsqueda (km)" value="150">

        <select id="reg-goal">
            <option value="estable">Busco Relación Estable 💍</option>
            <option value="casual">Busco Algo Casual 🔥</option>
            <option value="pensando">Lo sigo pensando 🤔</option>
            <option value="amigos">Solo amigos ☕</option>
        </select>

        <select id="reg-family">
            <option value="no_hijos">No tengo hijos y no quiero</option>
            <option value="tengo_hijos">Tengo hijos 👶</option>
            <option value="quiero_hijos">No tengo pero sí quiero hijos</option>
        </select>

        <input type="text" id="reg-country" placeholder="Tu País / Ciudad">
        <textarea id="reg-bio" placeholder="Escribe tu biografía detallada aquí..."></textarea>

        <!-- SECCIÓN DE SUBIDA DE ARCHIVOS DIGITALES -->
        <div class="upload-section">
            <label>Subir tus 3 Fotos Obligatorias (Galería):</label>
            <input type="file" id="file-photos" multiple accept="image/*">
            <label style="margin-top:10px;">Selfie de Verificación Facial de Rostro:</label>
            <input type="file" id="file-selfie" accept="image/*">
        </div>

        <div class="interest-chips">
            <div class="chip" onclick="toggleChip(this, '🎵 Música')">🎵 Música</div>
            <div class="chip" onclick="toggleChip(this, '⚽ Deportes')">⚽ Deportes</div>
            <div class="chip" onclick="toggleChip(this, '🎬 Cine')">🎬 Cine</div>
            <div class="chip" onclick="toggleChip(this, '✈️ Viajar')">✈️ Viajar</div>
            <div class="chip" onclick="toggleChip(this, '🎮 Juegos')">🎮 Juegos</div>
        </div>

        <button class="btn-main" onclick="processRegistration()">Verificar e Ingresar</button>
    </div>

    <!-- FEED PRINCIPAL TIPO TINDER EVOLUTION -->
    <div class="app-container" id="app-screen">
        <!-- PESTAÑAS DE SEPARACIÓN DE GRUPOS -->
        <div class="group-tabs">
            <div class="tab active" onclick="changeGroup(this, 'todos')">🌐 Todos</div>
            <div class="tab" onclick="changeGroup(this, 'estable')">💍 Estables</div>
            <div class="tab" onclick="changeGroup(this, 'casual')">🔥 Casuales</div>
            <div class="tab" onclick="changeGroup(this, 'pensando')">🤔 Indecisos</div>
            <div class="tab" onclick="changeGroup(this, 'amigos')">☕ Amigos</div>
        </div>

        <div class="card" id="main-card">
            <div class="match-screen" id="match-pop">
                <h1 style="color:#2ecc71; font-size: 34px;">¡MATCH MUTUO! 😍</h1>
                <p>Ambos se gustan y están en el mismo grupo</p>
                <button onclick="closeMatch()" style="padding: 10px 20px; border-radius: 20px; border:none; background:#ff5864; color:white; font-weight:bold; cursor:pointer;">Seguir Deslizando</button>
            </div>

            <div class="img-counter" id="img-indicators"></div>
            <img src="" id="view-img" class="profile-img" onclick="nextPhoto()">
            
            <div class="info-panel">
                <div>
                    <span style="font-size:24px; font-weight:bold;" id="view-name"></span>
                    <span class="verified-badge" id="view-verified">✓ Verificado Real</span>
                    <p style="margin:2px 0; color:#555; font-size:14px;" id="view-geo"></p>
                    <p style="margin:2px 0; font-size:12px; font-weight:bold; color:#ff5864;" id="view-meta"></p>
                </div>
                <p class="profile-bio" id="view-bio"></p>
            </div>
        </div>

        <div class="actions">
            <button class="btn-action" style="color: #e74c3c;" onclick="getProfiles()">❌</button>
            <button class="btn-action" style="color: #2ecc71;" onclick="sendLike()">💚</button>
        </div>
    </div>

    <script>
        let myId = null;
        let profileList = [];
        let currentIndex = 0;
        let currentPhotoIndex = 0;
        let selectedInterests = [];
        let currentGroup = 'todos';

        // Convertir archivos de la galería local a texto Base64 interpretable por el servidor
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        function toggleChip(e, interest) {
            e.classList.toggle('selected');
            if(selectedInterests.includes(interest)) selectedInterests = selectedInterests.filter(i => i !== interest);
            else selectedInterests.push(interest);
        }

        async function processRegistration() {
            const name = document.getElementById('reg-name').value;
            const age = document.getElementById('reg-age').value;
            const photoFiles = document.getElementById('file-photos').files;
            const selfieFile = document.getElementById('file-selfie').files[0];

            if(!name || !age || photoFiles.length < 3 || !selfieFile) {
                return alert("Faltan campos, recuerda subir tus 3 fotos de galería y tu selfie de rostro obligatoria.");
            }

            // Procesar las imágenes de la galería en paralelo
            const base64Photos = [];
            for(let i=0; i<photoFiles.length; i++) {
